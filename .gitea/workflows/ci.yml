name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.event.after }}
          version: 3.95.9
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt --fail-on-scan-errors
      - name: Fail on verified secrets in full history
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        with:
          version: 3.95.9
          extra_args: --results=verified --exclude-paths=.github/trufflehog-exclude.txt --fail-on-scan-errors
      - name: Report unverified findings in full history
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work trufflesecurity/trufflehog:3.95.9 git file:///work --results=unverified,unknown --exclude-paths=.github/trufflehog-exclude.txt --no-update --github-actions

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: go vet ./...
      - run: staticcheck ./...

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Run tests with coverage
        run: |
          go generate ./src/graphql
          mkdir -p "/tmp/${{ github.repository_owner }}"
          COVDIR=$(mktemp -d "/tmp/${{ github.repository_owner }}/$(basename "${{ github.repository }}")-XXXXXX")
          echo "COVDIR=$COVDIR" >> "$GITHUB_ENV"
          mkdir -p "$COVDIR/data"
          TMPDIR="$COVDIR" go test -cover ./... -args -test.gocoverdir="$COVDIR/data"
          go tool covdata textfmt -i="$COVDIR/data" -o="$COVDIR/coverage.out"
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=60
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          echo "Coverage: ${PCT}%"
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage $PCT% < threshold $THRESHOLD%"
            exit 1
          fi
      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mail-coverage
          path: ${{ env.COVDIR }}/coverage.out

  build:
    if: github.event_name != 'schedule'
    needs: [lint, test]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set build information
        env:
          OFFICIAL_SITE: ${{ secrets.OFFICIAL_SITE }}
        run: |
          VERSION=$(git -c safe.directory="$PWD" rev-parse --short=7 HEAD)
          COMMIT_ID=$(git -c safe.directory="$PWD" rev-parse --short=7 HEAD)
          INTERNAL_NAME=$(sed -n 's/^internal_name:[[:space:]]*//p' IDEA.md | head -n1 | tr -d '[:space:]')
          test -n "$INTERNAL_NAME"
          printf 'INTERNAL_NAME=%s\n' "$INTERNAL_NAME" >> "$GITHUB_ENV"
          BUILD_EPOCH=$(date -u +%s)
          OFFICIAL_SITE="${OFFICIAL_SITE:-}"
          if [ -s site.txt ]; then OFFICIAL_SITE=$(cat site.txt); fi
          printf 'VERSION=%s\nCOMMIT_ID=%s\nBUILD_EPOCH=%s\nOFFICIAL_SITE=%s\n' "$VERSION" "$COMMIT_ID" "$BUILD_EPOCH" "$OFFICIAL_SITE" >> "$GITHUB_ENV"
      - name: Build target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=$VERSION' -X 'main.CommitID=$COMMIT_ID' -X 'main.BuildEpoch=$BUILD_EPOCH' -X 'main.OfficialSite=$OFFICIAL_SITE' -X 'main.internalName=$INTERNAL_NAME'"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o mail-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o mail-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src/client
      - name: Upload target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mail-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            mail-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  upload-artifacts:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: binaries
      - name: Check build matrix artifacts
        run: |
          test "$(find binaries -type f -name 'mail-*' ! -name 'mail-cli-*' | wc -l)" -eq 8
          test "$(find binaries -type f -name 'mail-cli-*' | wc -l)" -eq 8

  vuln-scan:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: govulncheck ./...

  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Build image for scanning
        run: docker build -t ghcr.io/apimgr/mail:ci-scan -f docker/Dockerfile .
      - name: Check required runtime tools
        run: |
          container_name="mail-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)"
          docker run --rm --no-healthcheck --name "$container_name" --entrypoint sh ghcr.io/apimgr/mail:ci-scan -c 'for tool in bash curl tor i2pd tini; do command -v "$tool" || exit 1; done'
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/apimgr/mail:ci-scan
          exit-code: '1'
          severity: CRITICAL,HIGH

  workflow-policy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Verify action pinning and trigger policy
        run: |
          set -eo pipefail
          FAIL=0
          for f in .github/workflows/*.yml .gitea/workflows/*.yml .forgejo/workflows/*.yml; do
            if grep -qE '^\s*pull_request_target\s*:' "$f"; then
              echo "::error file=$f::pull_request_target trigger is not allowed"
              FAIL=1
            fi
            while IFS= read -r line; do
              ref=$(echo "$line" | sed -E 's/.*uses:[[:space:]]*[^@]+@([^[:space:]]+).*/\1/')
              if ! echo "$ref" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error file=$f::unpinned action reference: $line"
                FAIL=1
              fi
            done < <(grep -E '^\s*-?\s*uses:' "$f")
          done
          exit "$FAIL"
