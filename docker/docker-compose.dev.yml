name: mail

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  mail:
    image: ghcr.io/apimgr/mail:devel
    container_name: mail-app
    hostname: mail
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/config:/config
      - ./volumes/data:/data
    ports:
      - "${MAIL_PORT:-64580}:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/mail", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - mail

networks:
  mail:
    name: mail
    external: false
